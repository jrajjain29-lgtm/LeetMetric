<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project1.css">
</head>
<body>

    <div class="container">
        <h1>LeetMetric</h1>
        <div class="user-container">
            <p>Enter Your UserName Below :</p>
            <div class="user-input-container">
                <input type="text" name="" id="user-input" placeholder="Enter your username here...">
                <button id="search-button">Search</button>
            </div>
        </div>

        <div class="stats-container">
            <div class="progress">
                <div class="progress-item ">
                    <div class="easy-progress circle">
                        <p>Easy</p>
                        <span id="easy-label"></span>
                     </div>
                </div>

                <div class="progress-item">
                    <div class="medium-progress circle">
                        <p>Medium</p>
                        <span id="medium-label"></span>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="hard-progress circle">
                        <p>Hard</p>
                        <span id="hard-label"></span>
                    </div>
                </div>

            </div>

            <div class="stats-cards">
                <div class="card">
                </div>
                <!-- directly populate card here from the javascript code -->
            </div>
        </div>
    </div>
        
    <script src="project.js"></script>
</body>
</html>
